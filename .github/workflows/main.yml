name: Build Text to Voice APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -o Text-to-Voice-Android-Project.zip -d extracted

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find extracted \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: Could not find settings.gradle or settings.gradle.kts in extracted ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            BUILD_CMD="./gradlew assembleDebug"
          else
            BUILD_CMD="gradle assembleDebug"
          fi

          $BUILD_CMD > build.log 2>&1 || {
            echo "=== EXACT COMPILATION ERRORS ==="
            grep -E "^e: |^FAILURE:|^> " build.log
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Text-to-Voice-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
